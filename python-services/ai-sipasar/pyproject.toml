[project]
name = "si-pasar-platform"
version = "1.0.0"
description = "Unified SiPromo and SiPasar Analytics platform for UMKM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "cloudinary>=1.41",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "greenlet>=3.1",
    "google-genai>=1.0",
    "pandas>=2.2.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[postgres]>=4.8",
    "psycopg2-binary>=2.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = [
    "S101",  # assert used in tests
    "S311",  # random module usage is acceptable for jitter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S301", "S311", "ASYNC240"]
"src/sipromo/presentation/**" = ["B008", "E501"]
"src/main.py" = ["E501"]
"src/sipasar/**" = ["E501"]
"src/sipasar/core/config.py" = ["S104"]
"migrations/**" = ["S105"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
strict = false
warn_unused_ignores = true
exclude = ["migrations/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires PostgreSQL with pgvector via testcontainers",
    "contract: provider contract tests",
    "security: security-focused tests",
    "evals: RAG evaluation tests",
    "analytics: SiPasar market analytics tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true
